[package]
name = "jonsbo-ds339-minimal"
version = "0.1.0"
edition = "2024"
description = "A minimal desktop application for displaying a configurable clock on the JONSBO DS339"
publish = false

[dependencies]

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.6", default-features = false, features = ["linux-native-basic-udev"] }
