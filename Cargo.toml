[package]
name = "jonsbo-ds339-minimal"
version = "0.1.0"
edition = "2024"
description = "A minimal desktop application for displaying a configurable clock on the JONSBO DS339"
license = "MIT"
repository = "https://github.com/00b7ce/DS339-minimal-clock"
readme = "README.md"
publish = false
default-run = "jonsbo-ds339-minimal"

[dependencies]
auto-launcher = "1.1.0"
chrono = "0.4.45"
ctrlc = "3.5.2"
directories = "6.0.0"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
fontdb = "0.24.0"
fontdue = "0.9.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tray-icon = "0.24.2"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.6", default-features = false, features = ["windows-native"] }
libloading = "0.8.9"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.6", default-features = false, features = ["linux-native-basic-udev"] }
rusb = "0.9.4"
